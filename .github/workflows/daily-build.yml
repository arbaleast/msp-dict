name: Daily Build

on:
  schedule:
    - cron: '30 3 * * *'  # 每天 03:30 UTC = 11:30 CST
  workflow_dispatch:  # 也可手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download rime-ice (via jsDelivr CDN)
        run: |
          mkdir -p cache
          echo "=== Downloading rime-ice ==="
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/base.dict.yaml" -o cache/rime-ice_base.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/ext.dict.yaml" -o cache/rime-ice_ext.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/tencent.dict.yaml" -o cache/rime-ice_tencent.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/8105.dict.yaml" -o cache/rime-ice_8105.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/others.dict.yaml" -o cache/rime-ice_others.txt
          echo "rime-ice done"

      - name: Download rime-frost (via jsDelivr CDN)
        run: |
          echo "=== Downloading rime-frost ==="
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/base.dict.yaml" -o cache/rime-frost_base.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/ext.dict.yaml" -o cache/rime-frost_ext.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/tencent.dict.yaml" -o cache/rime-frost_tencent.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/8105.dict.yaml" -o cache/rime-frost_8105.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/others.dict.yaml" -o cache/rime-frost_others.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/food.dict.yaml" -o cache/rime-frost_food.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/idiom.dict.yaml" -o cache/rime-frost_idiom.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/history.dict.yaml" -o cache/rime-frost_history.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/medication.dict.yaml" -o cache/rime-frost_medication.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/computer.dict.yaml" -o cache/rime-frost_computer.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/sport.dict.yaml" -o cache/rime-frost_sport.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/geography.dict.yaml" -o cache/rime-frost_geography.txt
          echo "rime-frost done"

      - name: Merge and convert
        run: |
          cat << 'PYEOF' > merge.py
          import os, struct

          def parse_rime(content):
              """解析 Rime 格式：词\t拼音\t词频"""
              entries = []
              for line in content.splitlines():
                  line = line.strip()
                  if not line: continue
                  if line.startswith('#') or line.startswith('---') \
                     or line.startswith('name:') or line.startswith('version:') or line.startswith('sort:'):
                      continue
                  parts = line.split('\t')
                  if len(parts) >= 3:
                      word = parts[0].strip()
                      pinyin = parts[1].strip()  # 保留拼音
                      try:
                          freq = int(parts[-1].strip())
                      except ValueError:
                          continue
                      if word and freq >= 0:
                          entries.append((word, pinyin, freq))
                  elif len(parts) == 2:
                      # 可能是 词\t词频 格式（没有拼音）
                      word = parts[0].strip()
                      try:
                          freq = int(parts[1].strip())
                      except ValueError:
                          continue
                      if word and freq >= 0:
                          entries.append((word, '', freq))
              return entries

          def merge(entries_list):
              """合并去重，返回 [(word, pinyin, freq), ...] 按词频降序"""
              word_data = {}  # word -> (pinyin, max_freq)
              for entries in entries_list:
                  for word, pinyin, freq in entries:
                      if word in word_data:
                          old_pinyin, old_freq = word_data[word]
                          word_data[word] = (old_pinyin if old_pinyin else pinyin, max(old_freq, freq))
                      else:
                          word_data[word] = (pinyin, freq)
              return sorted(word_data.items(), key=lambda x: x[1][1], reverse=True)

          def normalize_pinyin(p):
              """规范化拼音：移除空格，转小写，截断到4字符（Win10限制）"""
              return p.replace(' ', '').lower()[:4]

          def has_rare_char(word):
              """检查是否含生僻字（CJK扩展区）"""
              for c in word:
                  if ord(c) < 128:
                      continue
                  code = ord(c)
                  if 0x20000 <= code <= 0x2FA1F or 0xF900 <= code <= 0xFAFF:
                      return True
              return False

          # ========== 生成 Win10 DAT ==========
          # 格式来自 imewlconverter Win10MsPinyin.cs
          # Entry: magic(0x00100010) + hanzi_offset + rank + 0x06 + unknown(0) + unknown(0xE679CD20) + pinyin + split + word + term

          def build_win10_dat(words_with_pinyin, output_path):
              """生成微软拼音 Win10 用户词库 (.dat)"""
              HEADER_SIZE = 0x40
              phrase_offset_start = HEADER_SIZE
              phrase_count = len(words_with_pinyin)
              
              # 计算偏移和大小
              phrase_offsets = []
              current_offset = 0
              for word, pinyin_str, rank in words_with_pinyin:
                  pinyin_char_len = len(pinyin_str)  # 字符数，不是字节数
                  word_char_len = len(word)
                  # hanzi_offset = 8 + 8 + pinyin_bytes + 2 = 18 + pinyin_char_len * 2
                  hanzi_offset = 18 + pinyin_char_len * 2
                  # 词条大小 = 4+2+1+1+4+4 + pinyin_bytes + 2 + word_bytes + 2
                  entry_size = 4 + 2 + 1 + 1 + 4 + 4 + pinyin_char_len * 2 + 2 + word_char_len * 2 + 2
                  phrase_offsets.append(current_offset)
                  current_offset += entry_size
              
              phrase_start = phrase_offset_start + phrase_count * 4
              phrase_end = phrase_start + current_offset
              
              # 构建 header
              header = bytearray(HEADER_SIZE)
              header[0:8] = b'mschxudp'
              struct.pack_into('<I', header, 8, 0x00600002)
              struct.pack_into('<I', header, 12, 1)
              struct.pack_into('<I', header, 16, phrase_offset_start)
              struct.pack_into('<I', header, 20, phrase_start)
              struct.pack_into('<I', header, 24, phrase_end)
              struct.pack_into('<I', header, 28, phrase_count)
              struct.pack_into('<Q', header, 32, 0)
              
              # 构建 offset 表
              offset_table = b''.join(struct.pack('<I', off) for off in phrase_offsets)
              
              # 构建词条（用 list 最后 join，避免 phrases += entry 的 O(n²) 问题）
              phrase_parts = []
              for word, pinyin_str, rank in words_with_pinyin:
                  pinyin_char_len = len(pinyin_str)
                  word_char_len = len(word)
                  pinyin_utf16 = pinyin_str.encode('utf-16-le')
                  word_utf16 = word.encode('utf-16-le')
                  hanzi_offset = 18 + pinyin_char_len * 2
                  
                  entry  = struct.pack('<I', 0x00100010)  # magic
                  entry += struct.pack('<H', hanzi_offset)
                  entry += bytes([rank & 0xFF, 0x06])
                  entry += struct.pack('<I', 0x00000000)   # unknown
                  entry += struct.pack('<I', 0xE679CD20)   # unknown (关键！)
                  entry += pinyin_utf16                    # pinyin (可变长)
                  entry += struct.pack('<H', 0)            # split
                  entry += word_utf16                      # word
                  entry += struct.pack('<H', 0)            # terminator
                  phrase_parts.append(entry)
              
              data = bytes(header) + offset_table + b''.join(phrase_parts)
              with open(output_path, 'wb') as f:
                  f.write(data)
              print(f'已生成 {output_path}: {len(words_with_pinyin):,} 词条, {len(data)/1024/1024:.1f} MB')

          files = [
              'rime-ice_base.txt', 'rime-ice_ext.txt', 'rime-ice_tencent.txt',
              'rime-ice_8105.txt', 'rime-ice_others.txt',
              'rime-frost_base.txt', 'rime-frost_ext.txt', 'rime-frost_tencent.txt',
              'rime-frost_8105.txt', 'rime-frost_others.txt',
              'rime-frost_food.txt', 'rime-frost_idiom.txt', 'rime-frost_history.txt',
              'rime-frost_medication.txt', 'rime-frost_computer.txt',
              'rime-frost_sport.txt', 'rime-frost_geography.txt',
          ]

          all_entries = []
          for fn in files:
              path = os.path.join('cache', fn)
              if os.path.exists(path):
                  with open(path, encoding='utf-8') as f:
                      entries = parse_rime(f.read())
                      all_entries.append(entries)
                      print(f'{fn}: {len(entries):,} 条')

          merged = merge(all_entries)
          print(f'\n去重后: {len(merged):,} 条')

          # 生成所有版本 Win10 DAT（2-6字符，有拼音，无生僻字）
          print('\n=== 生成 Win10 DAT ===')
          total_dat_words = 0
          for min_freq, suffix in [(1,'full'), (10,'freq10'), (50,'freq50'), (100,'freq100'), (500,'freq500')]:
              dat_words = [(w, normalize_pinyin(p), min(f//200, 255)) 
                          for w, (p, f) in merged 
                          if len(w) >= 2 and len(w) <= 6 and f >= min_freq and p and not has_rare_char(w)]
              total_dat_words += len(dat_words)
              out = f'msp_{suffix}.dat'
              build_win10_dat(dat_words, out)
              print(f'{out}: {len(dat_words):,} 词条')
          print(f'DAT 总词条: {total_dat_words:,}')

          # 生成 changelog
          today = __import__('datetime').date.today().isoformat()
          with open('CHANGELOG.md', 'w') as f:
              f.write(f'# 更新日期: {today}\n\n')
              f.write(f'## 词库统计\n')
              f.write(f'- 去重后总词条: {len(merged):,}\n')
              f.write(f'- 词频≥100: {sum(1 for _,(_,f) in merged if f>=100):,}\n')
              f.write(f'- 词频≥500: {sum(1 for _,(_,f) in merged if f>=500):,}\n')
              f.write(f'- DAT 总词条: {total_dat_words:,}\n')
              f.write(f'\n## 来源版本\n')
              for fn in files:
                  path = os.path.join('cache', fn)
                  if os.path.exists(path):
                      with open(path, encoding='utf-8') as cf:
                          count = len(parse_rime(cf.read()))
                          f.write(f'- {fn}: {count:,} 条\n')
          print('CHANGELOG.md 已生成')
          PYEOF
          python3 merge.py

      - name: Commit and push
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add msp_*.dat CHANGELOG.md cache/
          if git diff --cached --quiet; then
            echo "没有更新，跳过提交"
          else
            git commit -m "Daily build: $TODAY"
            git push
            echo "已推送更新"
          fi

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          TAG="v1.2-$TODAY"
          
          # 读取 CHANGELOG.md 作为 release body
          BODY=$(cat CHANGELOG.md)
          
          # 创建新 release（每天一个新版本）
          gh release create "$TAG" msp_*.dat \
            --repo ${{ github.repository }} \
            --title "微软拼音词库 $TAG" \
            --notes "$BODY"
          
          echo "已创建 release: $TAG"
