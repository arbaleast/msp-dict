name: Weekly Build

on:
  schedule:
    - cron: '0 3 * * 1'  # 每周一 03:00 UTC = 11:00 CST
  workflow_dispatch:  # 也可手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download rime-ice
        run: |
          mkdir -p cache
          echo "=== Downloading rime-ice ==="
          curl -sL "https://raw.githubusercontent.com/iDvel/rime-ice/main/cn_dicts/base.dict.yaml" -o cache/rime-ice_base.txt
          curl -sL "https://raw.githubusercontent.com/iDvel/rime-ice/main/cn_dicts/ext.dict.yaml" -o cache/rime-ice_ext.txt
          curl -sL "https://raw.githubusercontent.com/iDvel/rime-ice/main/cn_dicts/tencent.dict.yaml" -o cache/rime-ice_tencent.txt
          curl -sL "https://raw.githubusercontent.com/iDvel/rime-ice/main/cn_dicts/8105.dict.yaml" -o cache/rime-ice_8105.txt
          curl -sL "https://raw.githubusercontent.com/iDvel/rime-ice/main/cn_dicts/others.dict.yaml" -o cache/rime-ice_others.txt
          echo "rime-ice done"

      - name: Download rime-frost
        run: |
          echo "=== Downloading rime-frost ==="
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts/base.dict.yaml" -o cache/rime-frost_base.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts/ext.dict.yaml" -o cache/rime-frost_ext.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts/tencent.dict.yaml" -o cache/rime-frost_tencent.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts/8105.dict.yaml" -o cache/rime-frost_8105.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts/others.dict.yaml" -o cache/rime-frost_others.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts_cell/food.dict.yaml" -o cache/rime-frost_food.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts_cell/idiom.dict.yaml" -o cache/rime-frost_idiom.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts_cell/history.dict.yaml" -o cache/rime-frost_history.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts_cell/medication.dict.yaml" -o cache/rime-frost_medication.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts_cell/computer.dict.yaml" -o cache/rime-frost_computer.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts_cell/sport.dict.yaml" -o cache/rime-frost_sport.txt
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/cn_dicts_cell/geography.dict.yaml" -o cache/rime-frost_geography.txt
          echo "rime-frost done"

      - name: Fetch hot words from crawler (5 data sources)
        run: |
          echo "=== Fetching hot words from 5 sources ==="
          echo "Sources: github, wikipedia, bilibili, moegirl, wikidata"
          python3 -m crawler.cli fetch --all --limit 200 -o cache/hot_words.txt
          echo "Hot words fetched: $(wc -l < cache/hot_words.txt)"

      - name: Merge and convert
        run: |
          cat << 'PYEOF' > merge.py
          import os
          import datetime

          def parse_rime(content):
              entries = []
              for line in content.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith('#') or line.startswith('---') \
                     or line.startswith('name:') or line.startswith('version:') or line.startswith('sort:'):
                      continue
                  parts = line.split('\t')
                  if len(parts) >= 3:
                      word = parts[0].strip()
                      pinyin = parts[1].strip()  # 保留拼音
                      try:
                          freq = int(parts[-1].strip())
                      except ValueError:
                          continue
                      if word and freq >= 0:
                          entries.append((word, pinyin, freq))
                  elif len(parts) == 2:
                      # 可能是 词\t词频 格式（没有拼音）
                      word = parts[0].strip()
                      try:
                          freq = int(parts[1].strip())
                      except ValueError:
                          continue
                      if word and freq >= 0:
                          entries.append((word, '', freq))
              return entries

          def merge(entries_list):
              word_data = {}  # word -> (pinyin, max_freq)
              for entries in entries_list:
                  for word, pinyin, freq in entries:
                      if word in word_data:
                          old_pinyin, old_freq = word_data[word]
                          word_data[word] = (old_pinyin if old_pinyin else pinyin, max(old_freq, freq))
                      else:
                          word_data[word] = (pinyin, freq)
              # 按词频排序，返回 [(word, pinyin, freq), ...]
              return sorted(word_data.items(), key=lambda x: x[1][1], reverse=True)

          def parse_hot_words(filepath):
              """解析爬虫获取的热词（无拼音，词频设为1）"""
              entries = []
              if os.path.exists(filepath):
                  with open(filepath, encoding='utf-8') as f:
                      for line in f:
                          word = line.strip()
                          if word:
                              entries.append((word, '', 1))
              return entries

          files = [
              'rime-ice_base.txt', 'rime-ice_ext.txt', 'rime-ice_tencent.txt',
              'rime-ice_8105.txt', 'rime-ice_others.txt',
              'rime-frost_base.txt', 'rime-frost_ext.txt', 'rime-frost_tencent.txt',
              'rime-frost_8105.txt', 'rime-frost_others.txt',
              'rime-frost_food.txt', 'rime-frost_idiom.txt', 'rime-frost_history.txt',
              'rime-frost_medication.txt', 'rime-frost_computer.txt',
              'rime-frost_sport.txt', 'rime-frost_geography.txt',
          ]

          all_entries = []
          for fn in files:
              path = os.path.join('cache', fn)
              if os.path.exists(path):
                  entries = parse_rime(open(path, encoding='utf-8').read())
                  all_entries.append(entries)
                  print(f'{fn}: {len(entries):,}')

          # 添加热词
          hot_entries = parse_hot_words('cache/hot_words.txt')
          if hot_entries:
              all_entries.append(hot_entries)
              print(f'hot_words.txt: {len(hot_entries):,}')

          merged = merge(all_entries)
          print(f'\n去重后: {len(merged):,} 条')

          for min_freq, suffix in [(1,'full'), (10,'freq10'), (50,'freq50'), (100,'freq100'), (500,'freq500')]:
              out = f'msp_{suffix}.txt'
              count = 0
              with open(out, 'w', encoding='utf-8') as f:
                  for word_data in merged:
                      word = word_data[0]
                      pinyin, freq = word_data[1]
                      if freq >= min_freq:
                          # 保存为 词\t拼音\t词频 格式
                          f.write(f'{word}\t{pinyin}\t{freq}\n')
                          count += 1
              print(f'已生成 {out}: {count:,} 条')

          # 生成优化版词条 (freq>=200, 2-6字符, 无生僻字)
          print('\n=== 生成优化版 ===')
          def has_rare_char(word):
              for c in word:
                  if ord(c) < 128:
                      continue
                  code = ord(c)
                  if 0x20000 <= code <= 0x2FA1F or 0xF900 <= code <= 0xFAFF:
                      return True
              return False
          
          optimized = [(word, pinyin, freq) for word, (pinyin, freq) in merged
                        if len(word) >= 2 and len(word) <= 6 and freq >= 200 and not has_rare_char(word)]
          count = 0
          with open('msp_optimized.txt', 'w', encoding='utf-8') as f:
              for word, pinyin, freq in optimized:
                  f.write(f'{word}\t{pinyin}\t{freq}\n')
                  count += 1
          print(f'已生成 msp_optimized.txt: {count:,} 条')

          # 生成 changelog
          today = datetime.date.today().isoformat()
          with open('CHANGELOG.md', 'w') as f:
              f.write(f'# 更新日期: {today}\n\n')
              f.write(f'## 词库统计\n')
              f.write(f'- 去重后总词条: {len(merged):,}\n')
              f.write(f'- 词频≥100: {sum(1 for _,fr in merged if fr>=100):,}\n')
              f.write(f'- 词频≥500: {sum(1 for _,fr in merged if fr>=500):,}\n')
              f.write(f'- 来源版本\n')
              for fn in files:
                  path = os.path.join('cache', fn)
                  if os.path.exists(path):
                      count = len(parse_rime(open(path, encoding='utf-8').read()))
                      f.write(f'  - {fn}: {count:,} 条\n')
              if hot_entries:
                  f.write(f'  - hot_words.txt: {len(hot_entries):,} 条\n')
          print('CHANGELOG.md 已生成')
          PYEOF
          python3 merge.py

      - name: Build DAT files (mschxudp format)
        run: |
          echo "=== 使用 mschxudp 格式构建 DAT 文件 ==="
          python3 -m src.cli build msp_full.txt -o msp_full.dat
          python3 -m src.cli build msp_freq10.txt -o msp_freq10.dat
          python3 -m src.cli build msp_freq50.txt -o msp_freq50.dat
          python3 -m src.cli build msp_freq100.txt -o msp_freq100.dat
          python3 -m src.cli build msp_freq500.txt -o msp_freq500.dat
          python3 -m src.cli build msp_optimized.txt -o msp_optimized.dat
          echo "=== 所有 DAT 文件构建完成 ==="

      - name: Commit and push
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add msp_*.txt msp_*.dat CHANGELOG.md
          if git diff --cached --quiet; then
            echo "没有更新，跳过提交"
          else
            git commit -m "Weekly build: $TODAY"
            git push
            echo "已推送更新"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y%m%d)
          # 删除旧的 release
          if gh release view "v1.0" --repo ${{ github.repository }} 2>/dev/null; then
            gh release delete "v1.0" --repo ${{ github.repository }} -y 2>/dev/null || true
          fi
          # 创建新 release（包含 DAT 文件）
          gh release create "v1.0" msp_*.dat \
            --title "微软拼音词库 v1.0" \
            --notes "基于 rime-ice + rime-frost + 热词爬虫的每周构建\n\n直接下载 .dat 文件导入微软拼音使用。"
          echo "Release 已更新"
