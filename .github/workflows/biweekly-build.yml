name: Biweekly Build

on:
  schedule:
    # 每月 1 日和 15 日，两个低峰时段各触发一次（UTC）
    #   主：04:17 UTC = 12:17 北京时间（凌晨低峰，避开整点拥堵）
    #   备：12:17 UTC = 20:17 北京时间（主任务被延迟时的兜底）
    # 两次跑的是同一个按日期命名的 tag（vYYYY.MM.DD），同日重跑只更新不新建。
    - cron: '17 4 1,15 * *'
    - cron: '17 12 1,15 * *'
  workflow_dispatch:  # 也可手动触发

# 同一时间只跑一个构建，避免两个延迟任务并发 push 同一分支
concurrency:
  group: biweekly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pip pytest requests pypinyin

      - name: Run tests
        run: python -m pytest tests -q

      - name: Download rime-ice (via jsDelivr CDN)
        run: |
          mkdir -p cache
          # CDN 偶发 403/限流：单个文件重试 3 次，仍失败才报错（merge.py 还有兜底校验）
          fetch() {
            local url="$1" out="$2"
            for i in 1 2 3; do
              if curl -sfL "$url" -o "$out" && [ -s "$out" ]; then return 0; fi
              echo "  重试 $i/3: $url"
              sleep $((i * 3))
            done
            echo "::error::下载失败: $url"
            return 1
          }
          echo "=== Downloading rime-ice ==="
          fetch "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/base.dict.yaml" cache/rime-ice_base.txt
          fetch "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/ext.dict.yaml" cache/rime-ice_ext.txt
          fetch "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/tencent.dict.yaml" cache/rime-ice_tencent.txt
          fetch "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/8105.dict.yaml" cache/rime-ice_8105.txt
          fetch "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/others.dict.yaml" cache/rime-ice_others.txt
          echo "rime-ice done"

      - name: Download rime-frost (via jsDelivr CDN)
        run: |
          mkdir -p cache
          # CDN 偶发 403/限流：单个文件重试 3 次，仍失败才报错（merge.py 还有兜底校验）
          fetch() {
            local url="$1" out="$2"
            for i in 1 2 3; do
              if curl -sfL "$url" -o "$out" && [ -s "$out" ]; then return 0; fi
              echo "  重试 $i/3: $url"
              sleep $((i * 3))
            done
            echo "::error::下载失败: $url"
            return 1
          }
          echo "=== Downloading rime-frost ==="
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/base.dict.yaml" cache/rime-frost_base.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/ext.dict.yaml" cache/rime-frost_ext.txt
          # rime-frost tencent.dict.yaml 约29MB，超过GitHub 25MB限制且未配置LFS，跳过
          # rime-ice tencent 已包含约98万腾讯词条
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/8105.dict.yaml" cache/rime-frost_8105.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/others.dict.yaml" cache/rime-frost_others.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/food.dict.yaml" cache/rime-frost_food.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/idiom.dict.yaml" cache/rime-frost_idiom.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/history.dict.yaml" cache/rime-frost_history.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/medication.dict.yaml" cache/rime-frost_medication.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/computer.dict.yaml" cache/rime-frost_computer.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/sport.dict.yaml" cache/rime-frost_sport.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/geography.dict.yaml" cache/rime-frost_geography.txt
          # 搜狗细胞词库（rime-frost 已转换好）
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/exthot.dict.yaml" cache/rime-frost_exthot.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/game.dict.yaml" cache/rime-frost_game.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/music.dict.yaml" cache/rime-frost_music.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/media.dict.yaml" cache/rime-frost_media.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/animal.dict.yaml" cache/rime-frost_animal.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/chess.dict.yaml" cache/rime-frost_chess.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/chess2.dict.yaml" cache/rime-frost_chess2.txt
          # rime-frost composite.dict.yaml 超过 jsDelivr 单文件 20MB 限制（HTTP 403），
          # 任何镜像都取不到，scripts/merge.py 已把它列为可选源
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/industry_product.dict.yaml" cache/rime-frost_industry_product.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/inputmethod.dict.yaml" cache/rime-frost_inputmethod.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/literature.dict.yaml" cache/rime-frost_literature.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/name.dict.yaml" cache/rime-frost_name.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/name2.dict.yaml" cache/rime-frost_name2.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/place.dict.yaml" cache/rime-frost_place.txt
          fetch "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/shulihua.dict.yaml" cache/rime-frost_shulihua.txt
          # 朙月拼音（jsDelivr 对此文件返回 403，改用 raw.githubusercontent.com）
          fetch "https://raw.githubusercontent.com/gaboolic/rime-frost/master/luna_pinyin.dict.yaml" cache/rime-frost_luna_pinyin.txt
          echo "rime-frost done"

      - name: Download extended sources (moegirl / zhwiki)
        run: |
          # 扩展源走上游 release，避免 CI 直接爬站；失败只告警不阻断（--strict-ext 可收紧）
          python scripts/download_frost.py --extended-only --cache cache

      - name: Merge RIME sources
        run: |
          echo "=== 合并词库（剔除无拼音的纯词频表） ==="
          python scripts/merge.py

      - name: Build release DAT files (lite / standard / full + canary)
        run: |
          echo "=== 构建三档词库 ==="
          python scripts/build_releases.py --input msp_full.txt
          echo "=== 构建带诊断探针的独立产物（正式词库不受影响） ==="
          python scripts/build_releases.py --input msp_full.txt --profiles lite \
            --with-canary --canary-only --summary build_summary_canary.json

      - name: Validate DAT files
        run: |
          echo "=== 校验产物（非 0 退出会阻断发布） ==="
          for f in msp_lite.dat msp_win10.dat msp_standard.dat msp_full.dat; do
            echo "--- $f"
            python -m src.cli validate "$f"
          done

      - name: Check canary probes
        run: |
          echo "=== Canary 四维检查（结构/探针/计数/实机四维） ==="
          python -m src.cli check-canary msp_lite_canary.dat --manifest msp_lite_canary.json

      - name: Upload DAT artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msp-dict-dat-${{ github.run_number }}
          path: |
            msp_lite.dat
            msp_standard.dat
            msp_full.dat
            msp_win10.dat
            msp_lite_canary.dat
            msp_lite_canary.json
            build_summary.json
            build_summary_canary.json
          retention-days: 30
          if-no-files-found: warn

      - name: Update README stats
        run: |
          echo "=== 更新 README.md 统计信息 ==="
          python3 scripts/update_readme.py
          echo "=== README 更新完成 ==="

      - name: Commit and push
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "没有更新，跳过提交"
          else
            git commit -m "Daily build: $TODAY"
            git push
            echo "已推送更新"
          fi

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          TITLE="$TAG — 微软拼音增强词库"

          TAG="$TAG" python - <<'PY'
          import json
          import os
          import pathlib

          tag = os.environ['TAG']
          labels = {
              'msp_lite.dat': '**推荐**：Windows 10/11 直接导入',
              'msp_standard.dat': '进阶：覆盖更广，管理页会明显卡顿',
              'msp_full.dat': '存档 / 转 Rime 等，**不要直接导入微软拼音**',
              'msp_win10.dat': '兼容旧链接，与 `msp_lite.dat` 完全一致',
          }
          summary = json.loads(pathlib.Path('build_summary.json').read_text(encoding='utf-8'))
          files = {item['file']: item for item in summary['profiles']}
          if 'msp_win10.dat' not in files and 'msp_lite.dat' in files:
              files['msp_win10.dat'] = dict(files['msp_lite.dat'], file='msp_win10.dat')

          rows = []
          for name in ('msp_lite.dat', 'msp_standard.dat', 'msp_full.dat', 'msp_win10.dat'):
              item = files.get(name)
              if not item:
                  continue
              size_mb = item['size_bytes'] / 1024 / 1024
              size = f'{size_mb:.0f} MB' if size_mb >= 1 else f'{item["size_bytes"] / 1024:.0f} KB'
              display = f'**{name}**' if name == 'msp_lite.dat' else name
              rows.append(f'| {display} | {item["entries"]:,} | {size} | {labels.get(name, "")} |')

          template = pathlib.Path('docs/release-notes-template.md').read_text(encoding='utf-8')
          notes = template.replace('{{TAG}}', tag).replace('{{TABLE}}', os.linesep.join(rows))
          pathlib.Path('release_notes.md').write_text(notes, encoding='utf-8')
          print(f'已生成 release_notes.md（{len(rows)} 个产物）')
          PY

          sha256sum msp_lite.dat msp_standard.dat msp_full.dat msp_win10.dat > SHA256SUMS
          ASSETS="msp_lite.dat msp_standard.dat msp_full.dat msp_win10.dat SHA256SUMS"

          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Release $TAG 已存在，更新标题/正文/资产"
            gh release edit "$TAG" --repo ${{ github.repository }} \
              --title "$TITLE" --notes-file release_notes.md
            gh release upload "$TAG" $ASSETS --clobber --repo ${{ github.repository }}
          else
            gh release create "$TAG" $ASSETS \
              --repo ${{ github.repository }} \
              --title "$TITLE" \
              --notes-file release_notes.md
            echo "已创建 release: $TAG"
          fi

      - name: Prune old releases (keep 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' > old_releases.txt
          if [ -s old_releases.txt ]; then
            while read -r tag; do
              echo "淘汰旧版本: $tag"
              gh release delete "$tag" --cleanup-tag --yes --repo ${{ github.repository }}
            done < old_releases.txt
          else
            echo "当前 Release 数量 ≤ 3，无需清理"
          fi
