name: Biweekly Build

on:
  schedule:
    # 每月 1 日和 15 日 03:30 UTC = 11:30 CST
    - cron: '30 3 1,15 * *'
  workflow_dispatch:  # 也可手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download rime-ice (via jsDelivr CDN)
        run: |
          mkdir -p cache
          echo "=== Downloading rime-ice ==="
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/base.dict.yaml" -o cache/rime-ice_base.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/ext.dict.yaml" -o cache/rime-ice_ext.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/tencent.dict.yaml" -o cache/rime-ice_tencent.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/8105.dict.yaml" -o cache/rime-ice_8105.txt
          curl -sL "https://cdn.jsdelivr.net/gh/iDvel/rime-ice@main/cn_dicts/others.dict.yaml" -o cache/rime-ice_others.txt
          echo "rime-ice done"

      - name: Download rime-frost (via jsDelivr CDN)
        run: |
          echo "=== Downloading rime-frost ==="
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/base.dict.yaml" -o cache/rime-frost_base.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/ext.dict.yaml" -o cache/rime-frost_ext.txt
          # rime-frost tencent.dict.yaml 约29MB，超过GitHub 25MB限制且未配置LFS，跳过
          # rime-ice tencent 已包含约98万腾讯词条
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/8105.dict.yaml" -o cache/rime-frost_8105.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts/others.dict.yaml" -o cache/rime-frost_others.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/food.dict.yaml" -o cache/rime-frost_food.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/idiom.dict.yaml" -o cache/rime-frost_idiom.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/history.dict.yaml" -o cache/rime-frost_history.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/medication.dict.yaml" -o cache/rime-frost_medication.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/computer.dict.yaml" -o cache/rime-frost_computer.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/sport.dict.yaml" -o cache/rime-frost_sport.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/geography.dict.yaml" -o cache/rime-frost_geography.txt
          # 搜狗细胞词库（rime-frost 已转换好）
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/exthot.dict.yaml" -o cache/rime-frost_exthot.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/game.dict.yaml" -o cache/rime-frost_game.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/music.dict.yaml" -o cache/rime-frost_music.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/media.dict.yaml" -o cache/rime-frost_media.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/animal.dict.yaml" -o cache/rime-frost_animal.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/chess.dict.yaml" -o cache/rime-frost_chess.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/chess2.dict.yaml" -o cache/rime-frost_chess2.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/composite.dict.yaml" -o cache/rime-frost_composite.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/industry_product.dict.yaml" -o cache/rime-frost_industry_product.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/inputmethod.dict.yaml" -o cache/rime-frost_inputmethod.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/literature.dict.yaml" -o cache/rime-frost_literature.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/name.dict.yaml" -o cache/rime-frost_name.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/name2.dict.yaml" -o cache/rime-frost_name2.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/place.dict.yaml" -o cache/rime-frost_place.txt
          curl -sL "https://cdn.jsdelivr.net/gh/gaboolic/rime-frost@master/cn_dicts_cell/shulihua.dict.yaml" -o cache/rime-frost_shulihua.txt
          # 朙月拼音（jsDelivr 对此文件返回 403，改用 raw.githubusercontent.com）
          curl -sL "https://raw.githubusercontent.com/gaboolic/rime-frost/master/luna_pinyin.dict.yaml" -o cache/rime-frost_luna_pinyin.txt
          echo "rime-frost done"

      - name: Merge RIME sources
        run: |
          cat << 'PYEOF' > merge.py
          import os, datetime

          def parse_rime(content):
              """解析 Rime 格式：词\t拼音\t词频"""
              entries = []
              for line in content.splitlines():
                  line = line.strip()
                  if not line: continue
                  if line.startswith('#') or line.startswith('---') \
                     or line.startswith('name:') or line.startswith('version:') or line.startswith('sort:'):
                      continue
                  parts = line.split('\t')
                  if len(parts) >= 3:
                      word = parts[0].strip()
                      pinyin = parts[1].strip()
                      try:
                          freq = int(parts[-1].strip())
                      except ValueError:
                          continue
                      if word and freq >= 0:
                          entries.append((word, pinyin, freq))
                  elif len(parts) == 2:
                      # 可能是 luna_pinyin 的 词\t拼音 格式（无词频）
                      word = parts[0].strip()
                      pinyin_candidate = parts[1].strip()
                      # 判断第二列是拼音还是词频：拼音不含数字
                      if pinyin_candidate and not any(c.isdigit() for c in pinyin_candidate):
                          if word and ord(word[0]) >= 0x4E00:  # CJK统一汉字
                              entries.append((word, pinyin_candidate, 1))
                      else:
                          # 词\t词频 格式
                          try:
                              freq = int(pinyin_candidate)
                          except ValueError:
                              continue
                          if word and freq >= 0:
                              entries.append((word, '', freq))
              return entries

          def merge(entries_list):
              """合并去重，返回 [(word, pinyin, freq), ...] 按词频降序"""
              word_data = {}  # word -> (pinyin, max_freq)
              for entries in entries_list:
                  for word, pinyin, freq in entries:
                      if word in word_data:
                          old_pinyin, old_freq = word_data[word]
                          word_data[word] = (old_pinyin if old_pinyin else pinyin, max(old_freq, freq))
                      else:
                          word_data[word] = (pinyin, freq)
              return sorted(word_data.items(), key=lambda x: x[1][1], reverse=True)

          files = [
              'rime-ice_base.txt', 'rime-ice_ext.txt', 'rime-ice_tencent.txt',
              'rime-ice_8105.txt', 'rime-ice_others.txt',
              'rime-frost_base.txt', 'rime-frost_ext.txt',
              # rime-frost tencent 跳过（29MB > 25MB GitHub限制，且rime-ice tencent已覆盖）
              'rime-frost_8105.txt', 'rime-frost_others.txt',
              # 搜狗细胞词库（21个）
              'rime-frost_food.txt', 'rime-frost_idiom.txt', 'rime-frost_history.txt',
              'rime-frost_medication.txt', 'rime-frost_computer.txt',
              'rime-frost_sport.txt', 'rime-frost_geography.txt',
              'rime-frost_exthot.txt', 'rime-frost_game.txt', 'rime-frost_music.txt',
              'rime-frost_media.txt', 'rime-frost_animal.txt', 'rime-frost_chess.txt',
              'rime-frost_chess2.txt', 'rime-frost_composite.txt',
              'rime-frost_industry_product.txt', 'rime-frost_inputmethod.txt',
              'rime-frost_literature.txt', 'rime-frost_name.txt', 'rime-frost_name2.txt',
              'rime-frost_place.txt', 'rime-frost_shulihua.txt',
              # 朙月拼音
              'rime-frost_luna_pinyin.txt',
          ]

          all_entries = []
          for fn in files:
              path = os.path.join('cache', fn)
              if os.path.exists(path):
                  with open(path, encoding='utf-8') as f:
                      entries = parse_rime(f.read())
                      all_entries.append(entries)
                      print(f'{fn}: {len(entries):,} 条')

          merged = merge(all_entries)
          print(f'\n去重后: {len(merged):,} 条')

          # 生成各词频等级文本文件
          for min_freq, suffix in [(1,'full'), (10,'freq10'), (50,'freq50'), (100,'freq100'), (500,'freq500')]:
              out = f'msp_{suffix}.txt'
              count = 0
              with open(out, 'w', encoding='utf-8') as f:
                  for word_data in merged:
                      word = word_data[0]
                      pinyin, freq = word_data[1]
                      if freq >= min_freq:
                          f.write(f'{word}\t{pinyin}\t{freq}\n')
                          count += 1
              print(f'已生成 {out}: {count:,} 条')

          # 生成 release notes
          today = datetime.date.today().isoformat()
          freq100_count = sum(1 for _, (_, f) in merged if f >= 100)
          freq500_count = sum(1 for _, (_, f) in merged if f >= 500)

          # 分类统计来源
          rime_ice_files = [f for f in files if f.startswith('rime-ice')]
          rime_frost_files = [f for f in files if f.startswith('rime-frost')]
          source_counts = {}
          for fn in files:
              path = os.path.join('cache', fn)
              if os.path.exists(path):
                  with open(path, encoding='utf-8') as cf:
                      source_counts[fn] = len(parse_rime(cf.read()))

          def src_total(file_list):
              return sum(source_counts.get(f, 0) for f in file_list)

          with open('CHANGELOG.md', 'w') as f:
              f.write(f'## 词库统计\n\n')
              f.write(f'| 指标 | 数值 |\n')
              f.write(f'|------|------|\n')
              f.write(f'| 去重后总词条 | {len(merged):,} |\n')
              f.write(f'| 词频 ≥ 100 | {freq100_count:,} |\n')
              f.write(f'| 词频 ≥ 500 | {freq500_count:,} |\n')
              f.write(f'\n## 数据来源\n\n')
              f.write(f'- **rime-ice** (雾凇拼音) — {src_total(rime_ice_files):,} 条\n')
              for fn in rime_ice_files:
                  if fn in source_counts:
                      f.write(f'  - {fn}: {source_counts[fn]:,} 条\n')
              f.write(f'\n- **rime-frost** (白霜拼音) — {src_total(rime_frost_files):,} 条\n')
              # 简化输出，只列出有内容的文件
              for fn in rime_frost_files:
                  if fn in source_counts and source_counts[fn] > 0:
                      # 去掉 rime-frost_ 前缀让列表更简洁
                      short_name = fn.replace('rime-frost_', '')
                      f.write(f'  - {short_name}: {source_counts[fn]:,} 条\n')
              f.write(f'\n## 下载文件\n\n')
              f.write(f'- `msp_full.dat` — 完整版\n')
              f.write(f'- `msp_freq10.dat` — 词频 ≥ 10\n')
              f.write(f'- `msp_freq50.dat` — 词频 ≥ 50\n')
              f.write(f'- `msp_freq100.dat` — 词频 ≥ 100\n')
              f.write(f'- `msp_freq500.dat` — 词频 ≥ 500\n')
          print('CHANGELOG.md 已生成')
          PYEOF
          python3 merge.py

      - name: Build DAT files (mschxudp format)
        run: |
          echo "=== 使用 mschxudp 格式构建 DAT 文件 ==="
          python3 -m src.cli build msp_full.txt -o msp_full.dat
          python3 -m src.cli build msp_freq10.txt -o msp_freq10.dat
          python3 -m src.cli build msp_freq50.txt -o msp_freq50.dat
          python3 -m src.cli build msp_freq100.txt -o msp_freq100.dat
          python3 -m src.cli build msp_freq500.txt -o msp_freq500.dat
          echo "=== 所有 DAT 文件构建完成 ==="

      - name: Commit and push
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add msp_*.txt msp_*.dat CHANGELOG.md cache/
          if git diff --cached --quiet; then
            echo "没有更新，跳过提交"
          else
            git commit -m "Daily build: $TODAY"
            git push
            echo "已推送更新"
          fi

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          TAG="v$(date +%Y.%m.%d)"
          
          # 读取 CHANGELOG.md 作为 release body
          BODY=$(cat CHANGELOG.md)
          
          # 优先创建，如果 TAG 已存在则跳过（每天只保留一个 release）
          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
          else
            gh release create "$TAG" msp_*.dat \
              --repo ${{ github.repository }} \
              --title "微软拼音词库 $TAG" \
              --notes "$BODY"
            echo "已创建 release: $TAG"
          fi
